name: Atualizar tabelas da Receita
on:
  schedule:
    - cron: "0 9 * * *"   # todo dia, 06:00 no horário de Brasília
  workflow_dispatch:       # botão "Run workflow" para atualizar na hora
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/atualizar-dados.mjs
      - name: Publicar se houve mudança
        run: |
          git config user.name "atualizador-rtc"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Tabelas da Receita: $(date -u +%F)" && git push)
