
name: Atualizar tabelas da Receita

on:
  schedule:
    - cron: "0 9 * * *" # Todo dia às 06:00 no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-tabelas-receita
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Atualizar tabelas
        run: node scripts/atualizar-dados.mjs

      - name: Publicar se houve mudança
        run: |
          git config user.name "atualizador-rtc"
          git config user.email "actions@users.noreply.github.com"

          git add data

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas tabelas."
          else
            git commit -m "Tabelas da Receita: $(date -u +%F)"

            git fetch origin main
            git rebase origin/main

            git push origin HEAD:main
          fi
